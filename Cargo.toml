[package]
name = "transport"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Transport kernel — TCP, TLS, DNS, signed dialkeys, gossip, edge (mesh) routing. Zero-dep core, opt-in tokio + rustls bindings. Unix-composable: every transport module is a small focused file with a single responsibility."
publish = false

[features]
# `pkarr::RelayClient` (the native pkarr-relay HTTP client, no `pkarr` [crate] dependency) and the
# `http_client` under it need tokio + rustls + tracing, so they live behind `native`, which is on
# by default. `--no-default-features` gets the wire-format-only core: dns, signed_dns, dialkey
# derivation and packet building, edge registry logic, discovery (checked: `cargo check
# --no-default-features`).
default = ["native"]
# `native.rs`, `gossip.rs` and `quic.rs` each open with `#![cfg(feature = "runtime-tokio")]`.
# The rename from `bedrock-transport` to this crate rewrote this block and inlined
# `runtime-tokio`'s `dep:tokio` into `native` without the name surviving, so those three
# modules compiled to nothing in every configuration -- including the default one -- and
# `use transport::gossip::...` failed with "could not find `gossip` in `transport`" while
# pointing at a `pub mod gossip;` that is right there. Restored with its original definition
# from bedrock-transport. None of the three reference rustls, so tokio alone is the gate.
runtime-tokio = ["dep:tokio"]
# `dep:serde`/`dep:serde_json`: `acme.rs`'s JWS/ACME-response JSON — the two crates were already
# declared below (optional, unused by anything until now), so this wires them in rather than
# adding a new dependency.
native = ["runtime-tokio", "dep:rustls", "dep:tokio-rustls", "dep:tracing", "dep:serde", "dep:serde_json", "dep:flate2", "dep:aws-lc-rs"]
# FIPS 140-3 validated cryptography for everything this crate signs or terminates with: the ACME
# account key, certificate keys, the edge's TLS server provider and the HTTP client's TLS provider
# all run on aws-lc-rs, and this switches that module to the validated build. Needs Go + CMake at
# build time (aws-lc-fips-sys). `rustls/fips` makes the providers expose only FIPS-approved suites.
fips = ["native", "aws-lc-rs/fips", "rustls/fips"]
federation = ["dep:pkarr"]
# `sync`: the set-difference file sync (S3/SigV4, HTTP/1.1 and HTTP/2, gRPC/HPACK, TLS 1.3, bundles,
# block images) and the `syncfold` binary. Moved here from hashtrinity. It is
# std-only apart from `hashtrinity::Table` and `hashtrinity::tregex` and the operating system's
# CSPRNG (the dd session nonces) via `aws-lc-rs`, which std has no portable way to reach; it is off
# by default so the zero-dependency core stays as it is.
syncfold = ["dep:aws-lc-rs"]
# Retained as an alias so existing `features = ["bind-edge-dns"]` consumers keep resolving: the
# authoritative DNS and the resolver probe now run on this crate's own `dns` module, no extra deps.
bind-edge-dns = ["native"]
# `bind-overlay` (8 cfg sites) and `bind-edge-dns` (3) still reference deps (hickory-proto,
# hickory-resolver, iroh) that aren't defined here. That code remains unreachable. Re-adding
# those dependency trees is a separate decision — federation.rs (2026-09-21, extracted from
# bedrock's ops.rs) is what `federation`'s 5 cfg sites in dialkey.rs were waiting on.

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "rt-multi-thread", "macros", "sync", "signal"], optional = true }
# aws-lc-rs is rustls' default provider (and what its `fips` feature builds on). `ring` is no longer
# enabled: every provider this crate installs or builds is aws-lc-rs.
rustls = { version = "0.23", optional = true }
aws-lc-rs = { version = "1", optional = true }
tokio-rustls = { version = "0.26", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# One apeiron for every crate in the graph: `apeiron::map::hashtrinity::Table<K, V>` crosses crate boundaries,
# so two apeiron SourceIds would be two incompatible types (E0308). This URL at this rev, no branch, no `.git`.
apeiron = { version = "0.1.0", git = "https://github.com/webfold-ai/apeiron", rev = "85b404b8dc89903c5c588a2cd1d10bfa5b9e64bc" }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
bytes = "1"
# `http_client`'s opt-in gzip decode (`ClientBuilder::gzip`/`RequestBuilder::gzip`). Optional and
# pulled in by `native` with the module it serves: `http_client` is gated on `native` (it needs
# tokio + rustls + tracing), so the wire-format-only zero-dep core does not build flate2.
flate2 = { version = "1", optional = true }
pkarr = { version = "8.0.1", optional = true }

# The unit tests of modules that are always compiled (`edge_verify`, `edge_proxy`) drive async code with
# `#[tokio::test]`/`Builder::new_current_thread`; without this, `cargo test --no-default-features`
# could not even compile them. Dev-only: the lib itself still builds with no tokio at all.
[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# Real certificates for the SNI-resolver and handshake tests (keys_match rejects fabricated pairs).
rcgen = "0.13"

[[bin]]
name = "meshd"
path = "src/bin/meshd.rs"
required-features = ["native"]

[[bin]]
name = "syncfold"
path = "src/bin/syncfold.rs"
required-features = ["syncfold"]

[[test]]
name = "syncfold_dd"
required-features = ["syncfold"]

[[test]]
name = "sync_hardening"
required-features = ["syncfold"]

[workspace]
resolver = "2"
members = ["crates/tas-lb", "crates/tas-dns", "crates/edge-lb", "crates/mesh-acl-reconciler", "crates/console-ws-proxy"]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["TasCloud Platform Team"]
repository = "https://github.com/webfold-ai/transport"
publish = false

[workspace.dependencies]
transport = { path = "." }
apeiron = { git = "https://github.com/webfold-ai/apeiron", rev = "85b404b8dc89903c5c588a2cd1d10bfa5b9e64bc" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
http = "1"
url = { version = "2", features = ["serde"] }
bytes = "1"
base64 = "0.21"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
governor = "0.6"
anyhow = "1"
thiserror = "2"
zeroize = "1"
tempfile = "3"
# Existing substrate/service contracts remain in their original homes. The pinned
# hosting baseline repairs kleis to its iotaDB home; no support crate is copied.
cache-client = { git = "https://github.com/Tasmanian-Cloud/hosting-runtime", rev = "212736bdbe70e5aeffe8118a9c23c42e3ef1bbfa" }
kleis = { git = "https://github.com/webfold-ai/iotadb", rev = "208e6e94a2ad00c226c2030776045f8d465cdb93", package = "kleis" }
saga-pipeline = { git = "https://github.com/Tasmanian-Cloud/saga", rev = "c82647b7094aba9e3fb673b1b1b5577a6af759cb" }
servelet-core = { git = "https://github.com/Ptyktos/servelet", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
servelet-h1 = { git = "https://github.com/Ptyktos/servelet", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
servelet-router = { git = "https://github.com/Ptyktos/servelet", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
servelet-tls = { git = "https://github.com/Ptyktos/servelet", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
servelet-client = { git = "https://github.com/Ptyktos/servelet", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }

# Keep legacy git consumers (e.g. the unlifted overlay test fixture) on THIS
# transport. Two SourceIds would make their Connection/Endpoint types incompatible.
[patch."https://github.com/Ptyktos/transport"]
transport = { path = "." }
[patch."https://github.com/webfold-ai/transport"]
transport = { path = "." }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mutant_scope_removed)", "cfg(mutant_wrong_namespace)", "cfg(mutant_edge_old_form)", "cfg(mutant_agent_old_form)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Preserve the lifted crates' existing test/dev optimisation level.
[profile.dev]
opt-level = 1

# `bind-overlay` names code written against the old bedrock `bind` crate; the feature has no
# dependency behind it here, so it is not declared (declaring it would enable code that cannot
# compile). Registering the name keeps `-D warnings` from rejecting the gated blocks.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("bind-overlay"))'] }
