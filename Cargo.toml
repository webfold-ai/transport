[package]
name = "transport"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Transport kernel — TCP, TLS, DNS, signed dialkeys, gossip, edge (mesh) routing. Zero-dep core, opt-in tokio + rustls bindings. Unix-composable: every transport module is a small focused file with a single responsibility."
publish = false

[features]
# `pkarr::RelayClient` (the native pkarr-relay HTTP client) is "always available, no `pkarr`
# [crate] dependency" per dialkey.rs's own doc comment — not an opt-in extra — so `native` is
# on by default. `--no-default-features` still gets the wire-format-only zero-dep core.
default = ["native"]
# `native.rs`, `gossip.rs` and `quic.rs` each open with `#![cfg(feature = "runtime-tokio")]`.
# The rename from `bedrock-transport` to this crate rewrote this block and inlined
# `runtime-tokio`'s `dep:tokio` into `native` without the name surviving, so those three
# modules compiled to nothing in every configuration -- including the default one -- and
# `use transport::gossip::...` failed with "could not find `gossip` in `transport`" while
# pointing at a `pub mod gossip;` that is right there. Restored with its original definition
# from bedrock-transport. None of the three reference rustls, so tokio alone is the gate.
runtime-tokio = ["dep:tokio"]
# `dep:serde`/`dep:serde_json`: `acme.rs`'s JWS/ACME-response JSON — the two crates were already
# declared below (optional, unused by anything until now), so this wires them in rather than
# adding a new dependency.
native = ["runtime-tokio", "dep:rustls", "dep:tokio-rustls", "dep:tracing", "dep:serde", "dep:serde_json"]
federation = ["dep:pkarr"]
bind-edge-dns = ["native", "dep:hickory-proto"]
# `bind-overlay` (8 cfg sites) and `bind-edge-dns` (3) still reference deps (hickory-proto,
# hickory-resolver, iroh) that aren't defined here. That code remains unreachable. Re-adding
# those dependency trees is a separate decision — federation.rs (2026-09-21, extracted from
# bedrock's ops.rs) is what `federation`'s 5 cfg sites in dialkey.rs were waiting on.
# `h2` — RFC 7541 HPACK + RFC 9113 HTTP/2 framing + gRPC-over-HTTP/2 unary call framing.
# Restored byte-for-byte from `hashtrinity/src/sync/{hpack,http2,grpc}.rs` at commit
# 81730cc^1 (Clay Townsend <task_81730cc@>, 2026-08-11) for TASK W-N. Zero deps beyond
# `std`; the modules carry their own 9+1+3 = 13 tests (and one additional gRPC server-
# side test for the unary gRPC echo method, in `src/h2/server.rs`). Off by default so a
# consumer that doesn't need gRPC (and doesn't want the ~1,400 lines and the doctests on
# them) can skip it. The transport README still calls this crate the protocol kernel;
# HTTP/2 + HPACK + gRPC framing is part of that kernel but is gated because the live
# integration test that talks to a real Terraform provider (deleted in the W-N adaptation
# commit because it needs `hashtrinity::sync::tls`, which transport does not depend on)
# would otherwise be a non-trivial runtime artefact. The audit is in
# `docs/h2-grpc/00-sweep-audit.md`; the adaptation + missing-tests list is in
# `docs/h2-grpc/02-adaptation.md`.
h2 = []

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "rt-multi-thread", "macros", "sync"], optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# One hashtrinity for every Ptyktos crate: this GitHub URL at this revision. Cargo treats
# different references to the same repo (rev vs branch vs none) as distinct SourceIds, and two
# copies make `hashtrinity::Table<K, V>` two incompatible types (E0308 "multiple different
# versions of crate `hashtrinity`"), so every consumer pins exactly this form.
hashtrinity = { git = "https://github.com/Ptyktos/hashtrinity", rev = "2c36b995c82c073c71df7c28b14c62665d62cbf0", features = ["base32"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
bytes = "1"
# `http_client`'s opt-in gzip decode (`ClientBuilder::gzip`/`RequestBuilder::gzip`) — plain,
# always-available, same tier as `bytes` above rather than behind a feature: `http_client` itself
# isn't gated (see its own doc comment in lib.rs), so neither is the dependency it needs.
flate2 = "1"
# `Tuple`/`Relationships`/`Upstream`/`LoadBalance`/`HealthEstimator`/`Backends`/`pick_index`/
# `coord_of`: `load_balance.rs` used to define these directly (its own independent extraction out
# of `biota-http-server`'s `kernel::Proxy`, done without knowing `relayfold` already existed as
# the same extraction out of `bedrock`). Reconciled 2026-09-23: `relayfold` is the superset (also
# carries `Tuple`/`Relationships`/`Upstream`/`Backends`, which this crate's version didn't) and is
# already what `bedrock` itself re-exports on both remotes, so it's canonical; `load_balance.rs`
# is now a thin re-export.
relayfold = { git = "https://github.com/Ptyktos/relayfold" }
pkarr = { version = "8.0.1", optional = true }
hickory-proto = { version = "0.24", optional = true }

[workspace]
