[package]
name = "console-ws-proxy"
description = "WebSocket forwarder for VNC / term consoles. Port of recovered Tainer src/server.mjs upgrade handler. Validates session + step-up + console-ticket; never accepts client-driven Origin missing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
[dependencies]
cache-client.workspace = true
# The credential + ticket-signing-key plane (see `kleis_wiring.rs`) — replaces the
# OpenBao dependency this crate's own module doc named: `cache_client::Cache` is the
# same trait `SangDbCache` implements (the `ValkeyTicketStore`'s `Arc<dyn Cache>` field
# doesn't care which backend), and a plain `api_token: String` / raw HMAC key are all
# `ProxmoxConsoleTarget`/`TicketSigner::new` ever needed — both fit `kleis::get_secret`
# directly, matching `deploy-api`'s own `KleisLookup` pattern exactly.
kleis.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio-tungstenite.workspace = true
http.workspace = true
url.workspace = true
apeiron = { workspace = true }
thiserror = { workspace = true }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
uuid.workspace = true
futures.workspace = true
reqwest.workspace = true
governor.workspace = true

[features]
default = []
# Real-Valkey integration test for `ValkeyTicketStore`. Off by default; CI
# sets it when a Valkey fixture is wired via `VALKEY_URL`. Same gating as
# `cache-client`'s `integration-valkey`.
integration-valkey = []

[lints]
workspace = true
